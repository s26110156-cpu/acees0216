<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢幻紫迷因產生器 ✨ Cute Meme Generator</title>
    
    <!-- 引入可愛圓潤與標題用字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- 引入 html2canvas CDN (用於將 DOM 轉為圖片下載) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* -------------------------------------------------------------
           [CSS 變數設定] 統一管理網頁主題顏色與字型
           ------------------------------------------------------------- */
        :root {
            --primary-purple: #9d4edf;
            --light-purple: #e0aaff;
            --soft-bg-1: #3c096c;
            --soft-bg-2: #240046;
            --card-glass: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
            --font-main: 'Fredoka', 'Noto Sans TC', sans-serif;
            --font-meme: 'Mochiy Pop One', 'Impact', sans-serif;
        }

        /* 全局基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #10002b 0%, #240046 35%, #3c096c 70%, #5a189a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景飄浮夢幻粒子效果 */
        .sparkle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(224, 170, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 78, 221, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
        }

        /* 主要標題樣式 */
        header {
            text-align: center;
            margin-bottom: 25px;
            z-index: 1;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f72585;
            background: linear-gradient(45deg, #ff9e00, #e0aaff, #7209b7, #4cc9f0);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientGlow 6s ease infinite;
            text-shadow: 0 0 20px rgba(224, 170, 255, 0.4);
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.95rem;
            color: #e0aaff;
            opacity: 0.85;
            margin-top: 6px;
        }

        @keyframes gradientGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 雙欄主容器 (主機版左控制右預覽，手機版自動直排) */
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            max-width: 1100px;
            z-index: 1;
            margin-bottom: 30px;
        }

        /* 控制面板卡片 (玻璃擬物化風格) */
        .control-panel {
            flex: 1;
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0aaff;
            border-bottom: 2px dashed rgba(224, 170, 255, 0.3);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 表單控制區塊與標籤 */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #f1c0e8;
            display: flex;
            justify-content: space-between;
        }

        .control-group label span.val-badge {
            background: rgba(157, 78, 221, 0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #ffffff;
        }

        /* 自訂上傳檔案按鈕外觀 */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .btn-upload {
            border: 2px dashed #c77dff;
            color: #ffffff;
            background: rgba(157, 78, 221, 0.2);
            padding: 12px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload:hover {
            background: rgba(157, 78, 221, 0.4);
            border-color: #e0aaff;
            box-shadow: 0 0 15px rgba(224, 170, 255, 0.4);
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* 文字輸入框樣式 */
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(224, 170, 255, 0.3);
            background: rgba(16, 0, 43, 0.5);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: #e0aaff;
            box-shadow: 0 0 10px rgba(224, 170, 255, 0.5);
        }

        /* 滑桿 (Range Input) 紫色系美化 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e0aaff;
            cursor: pointer;
            box-shadow: 0 0 10px #9d4edf;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #ffffff;
        }

        /* 顏色選擇器 */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        /* 迷因即時預覽卡片區塊 */
        .preview-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
        }

        /* 超酷截圖目標區域 */
        .meme-stage {
            position: relative;
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            background: #10002b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(157, 78, 221, 0.3);
            border: 2px solid rgba(224, 170, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* 顯示圖片容器 */
        .meme-stage img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 完整呈現圖片並維持比例 */
            display: block;
        }

        /* 重疊在圖片上的迷因文字 */
        .meme-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            font-family: var(--font-meme);
            font-weight: 900;
            line-height: 1.2;
            text-transform: uppercase;
            word-wrap: break-word;
            pointer-events: none;
            
            /* 關鍵：粗黑色描邊，讓任何淺色/深色底圖上的文字都極度清晰 */
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #000, -3px -3px 0 #000,
                3px -3px 0 #000, -3px 3px 0 #000,
                0px 3px 0 #000, 0px -3px 0 #000,
                3px 0px 0 #000, -3px 0px 0 #000,
                0px 5px 10px rgba(0, 0, 0, 0.8);
            transition: top 0.05s ease, bottom 0.05s ease, font-size 0.05s ease;
        }

        .meme-text.top {
            top: 5%;
        }

        .meme-text.bottom {
            bottom: 5%;
        }

        /* 一鍵下載的亮眼按鈕 */
        .btn-download {
            width: 100%;
            max-width: 520px;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff79c6 0%, #bd93f9 50%, #ff922b 100%);
            background-size: 200% 200%;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(189, 147, 249, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-download:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 30px rgba(255, 121, 198, 0.6);
            background-position: 100% 0%;
        }

        .btn-download:active {
            transform: translateY(1px);
        }

        /* RWD 響應式排版 (手機版視窗小於 768px 時切換為單欄) */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .control-panel {
                padding: 18px;
            }

            .meme-stage {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 夢幻星空微光背景效果 -->
    <div class="sparkle-bg"></div>

    <header>
        <h1>✨ 轉瞬即逝的夢幻紫迷因產生器 💜</h1>
        <p>上傳你的專屬圖片，輕鬆調整字幕，快速創造屬於你的可愛迷因！</p>
    </header>

    <!-- 主應用程式雙欄區塊 -->
    <div class="app-container">
        
        <div class="control-panel">
            <div class="panel-title">🎨 迷因創作控制台</div>

            <!-- 1. 本地圖片上傳 -->
            <div class="control-group">
                <label>1. 選擇底圖 (支援 JPG, PNG, WEBP)</label>
                <div class="file-upload-wrapper">
                    <div class="btn-upload">
                        <span>📷 點擊上傳本機圖片</span>
                    </div>
                    <!-- 使用 file input 讀取本地檔案，避免 CORS 跨域圖片下載失敗問題 -->
                    <input type="file" id="image-upload" accept="image/*">
                </div>
            </div>

            <!-- 2. 上方文字輸入 -->
            <div class="control-group">
                <label for="top-text-input">2. 上方文字 (Top Text)</label>
                <input type="text" id="top-text-input" placeholder="寫些幽默的句子吧..." value="當你寫出沒有 BUG 的程式碼">
            </div>

            <!-- 3. 下方文字輸入 -->
            <div class="control-group">
                <label for="bottom-text-input">3. 下方文字 (Bottom Text)</label>
                <input type="text" id="bottom-text-input" placeholder="或者是出乎意料的反轉..." value="（感覺簡直像是魔法）">
            </div>

            <!-- 4. 字體大小控制滑桿 -->
            <div class="control-group">
                <label for="font-size-slider">
                    <span>4. 字體大小 (Font Size)</span>
                    <span class="val-badge" id="font-size-val">36px</span>
                </label>
                <input type="range" id="font-size-slider" min="16" max="72" value="36">
            </div>

            <!-- 5. 上方文字垂直位置滑桿 -->
            <div class="control-group">
                <label for="top-pos-slider">
                    <span>5. 上方文字垂直位置 (Top Pos)</span>
                    <span class="val-badge" id="top-pos-val">5%</span>
                </label>
                <input type="range" id="top-pos-slider" min="0" max="45" value="5">
            </div>

            <!-- 6. 下方文字垂直位置滑桿 -->
            <div class="control-group">
                <label for="bottom-pos-slider">
                    <span>6. 下方文字垂直位置 (Bottom Pos)</span>
                    <span class="val-badge" id="bottom-pos-val">5%</span>
                </label>
                <input type="range" id="bottom-pos-slider" min="0" max="45" value="5">
            </div>

            <!-- 7. 文字顏色選擇 -->
            <div class="control-group">
                <label for="text-color-picker">7. 文字顏色 (Text Color)</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="text-color-picker" value="#ffffff">
                    <span style="font-size: 0.85rem; color: #e0aaff;">選擇喜歡的文字色彩</span>
                </div>
            </div>
        </div>

        <div class="preview-panel">
            
            <!-- 被截圖的迷因舞台 (Preview Canvas Box) -->
            <div class="meme-stage" id="meme-stage">
                <!-- 預設占位圖片 (使用可愛 SVG 圖示) -->
                <img id="meme-image" src="https://placehold.co/600x600/3c096c/e0aaff?text=Upload+Your+Image+%E2%9C%A8" alt="Meme Preview">
                
                <!-- 上方與下方動態文字 -->
                <div class="meme-text top" id="meme-top-text">當你寫出沒有 BUG 的程式碼</div>
                <div class="meme-text bottom" id="meme-bottom-text">（感覺簡直像是魔法）</div>
            </div>

            <!-- 一鍵下載按鈕 -->
            <button class="btn-download" id="download-btn">
                <span>✨ 匯出並下載迷因 (my-meme.png)</span>
            </button>
        </div>

    </div>

    <script>
        /* -------------------------------------------------------------
           [JavaScript 邏輯] 掌握互動事件與 DOM 元素操作
           ------------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            
            // 取得 HTML 中的各項元件 (DOM 節點)
            const imageUpload = document.getElementById('image-upload');
            const memeImage = document.getElementById('meme-image');
            
            const topTextInput = document.getElementById('top-text-input');
            const bottomTextInput = document.getElementById('bottom-text-input');
            const memeTopText = document.getElementById('meme-top-text');
            const memeBottomText = document.getElementById('meme-bottom-text');
            
            const fontSizeSlider = document.getElementById('font-size-slider');
            const fontSizeVal = document.getElementById('font-size-val');
            
            const topPosSlider = document.getElementById('top-pos-slider');
            const topPosVal = document.getElementById('top-pos-val');
            
            const bottomPosSlider = document.getElementById('bottom-pos-slider');
            const bottomPosVal = document.getElementById('bottom-pos-val');
            
            const textColorPicker = document.getElementById('text-color-picker');
            const downloadBtn = document.getElementById('download-btn');
            const memeStage = document.getElementById('meme-stage');

            /* =========================================================
               1. 本地圖片讀取功能 (FileReader API 避開 CORS 錯誤)
               ========================================================= */
            imageUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                
                if (file) {
                    // 建立 FileReader 物件讀取檔案
                    const reader = new FileReader();
                    
                    // 當檔案讀取完成後觸發
                    reader.onload = function(event) {
                        // 將讀取到的 base64 圖片數據設定為 <img> 的 src
                        memeImage.src = event.target.result;
                    };
                    
                    // 以 DataURL 格式讀取本地檔案
                    reader.readAsDataURL(file);
                }
            });

            /* =========================================================
               2. 文字動態即時同步 (Input Keyup / Input Events)
               ========================================================= */
            topTextInput.addEventListener('input', () => {
                memeTopText.innerText = topTextInput.value;
            });

            bottomTextInput.addEventListener('input', () => {
                memeBottomText.innerText = bottomTextInput.value;
            });

            /* =========================================================
               3. 參數滑桿控制 (字體大小與垂直位置微調)
               ========================================================= */
            // 調整字體大小
            fontSizeSlider.addEventListener('input', () => {
                const size = fontSizeSlider.value + 'px';
                memeTopText.style.fontSize = size;
                memeBottomText.style.fontSize = size;
                fontSizeVal.innerText = size;
            });

            // 調整上方文字 Top 位置
            topPosSlider.addEventListener('input', () => {
                const pos = topPosSlider.value + '%';
                memeTopText.style.top = pos;
                topPosVal.innerText = pos;
            });

            // 調整下方文字 Bottom 位置
            bottomPosSlider.addEventListener('input', () => {
                const pos = bottomPosSlider.value + '%';
                memeBottomText.style.bottom = pos;
                bottomPosVal.innerText = pos;
            });

            // 調整文字顏色
            textColorPicker.addEventListener('input', () => {
                const color = textColorPicker.value;
                memeTopText.style.color = color;
                memeBottomText.style.color = color;
            });

            /* =========================================================
               4. 一鍵下載迷因圖檔 (使用 html2canvas 截圖並存檔)
               ========================================================= */
            downloadBtn.addEventListener('click', () => {
                // 提示按鈕正在處理中
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '<span>⏳ 產生圖檔中，請稍候...</span>';
                downloadBtn.style.opacity = '0.7';

                // 使用 html2canvas 將 #meme-stage 區塊轉為 Canvas
                html2canvas(memeStage, {
                    useCORS: true,       // 允許跨域圖片 (若有 external 資源)
                    scale: 2,            // 提升截圖清晰度 (2倍解析度)
                    backgroundColor: null// 保持透明底或照原有背景渲染
                }).then(canvas => {
                    // 將 Canvas 轉換為 PNG 圖片網址
                    const imageUrl = canvas.toDataURL('image/png');
                    
                    // 建立隱藏的 <a> 標籤來觸發瀏覽器下載
                    const downloadLink = document.createElement('a');
                    downloadLink.href = imageUrl;
                    downloadLink.download = 'my-meme.png'; // 下載的檔案名稱
                    
                    // 觸發點擊並移除標籤
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);

                    // 恢復下載按鈕狀態
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.style.opacity = '1';
                }).catch(err => {
                    console.error('產生圖片失敗：', err);
                    alert('產生迷因失敗，請稍後再試！');
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.style.opacity = '1';
                });
            });

            // 初始化設定預設字體大小樣式
            memeTopText.style.fontSize = fontSizeSlider.value + 'px';
            memeBottomText.style.fontSize = fontSizeSlider.value + 'px';
        });
    </script>
</body>
</html>
